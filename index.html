<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>奔跑吧！小猫鼠！</title>
<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }
    body {
        overflow: hidden;
        background-color: #000;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        width: 100vw;
    }
    #gameCanvas {
        border: none;
        max-width: 100vw;
        max-height: 100vh;
        object-fit: contain;
    }
</style>
</head>
<body>
    <canvas id="gameCanvas" width="800" height="300"></canvas>

    <script>
        // ===================== 1. 预加载游戏图片和音频 =====================
        const images = {
            bg: new Image(),
            dino1: new Image(), dino2: new Image(), dino3: new Image(),
            dino4: new Image(), dino5: new Image(), dino6: new Image(),
            stone: new Image(), cacti: new Image(), boom: new Image(),
            mechanicalCat: new Image(), mechanicalMouse: new Image()
        };

        const audios = {
            bgm: new Audio("./music/background.wav"),
            hit: new Audio("./music/hit.wav"),
            jump: new Audio("./music/jump.wav")
        };
        audios.bgm.loop = true;
        audios.bgm.volume = 0.4;
        audios.hit.volume = 0.6;
        audios.jump.volume = 0.6;
        let audioInited = false;

        images.bg.src = "./image/背景.png";
        images.dino1.src = "./image/鼠鼠奔跑1.png";
        images.dino2.src = "./image/鼠鼠奔跑2.png";
        images.dino3.src = "./image/常态鼠鼠.png";
        images.dino4.src = "./image/鼠鼠寄了.png";
        images.dino5.src = "./image/化灰.png";
        images.dino6.src = "./image/闭眼.png";
        images.stone.src = "./image/石头.png";
        images.cacti.src = "./image/仙人掌.png";
        images.boom.src = "./image/爆炸.png";
        images.mechanicalCat.src = "./image/机械猫.png";
        images.mechanicalMouse.src = "./image/机械鼠.png";

        // ===================== 2. 定义JS类 =====================
        class Dinosaur {
            constructor() {
                this.x = 50;
                this.y = 205;
                this.image = images.dino3;
                this.jumpValue = 0;
                this.jumpState = false;
                this.stepTimer = 0;
                this.JUMP_HEIGHT = 105;
                this.LOWEST_Y = 205;
                this.isDead = false;
            }

            move() {
                if (!this.isDead) {
                    this.step();
                    if (this.jumpState) {
                        this.y += this.jumpValue;
                        this.jumpValue += 0.8;
                        if (this.y >= this.LOWEST_Y) {
                            this.y = this.LOWEST_Y;
                            this.jumpState = false;
                            this.jumpValue = 0;
                        }
                    }
                } else {
                    if (this.y < this.LOWEST_Y) {
                        this.y += 4;
                        if (this.y > this.LOWEST_Y) {
                            this.y = this.LOWEST_Y;
                        }
                    }
                }
            }

            jump() {
                if (!this.jumpState && !this.isDead) {
                    this.jumpState = true;
                    this.jumpValue = -1;
                    if (audioInited) {
                        audios.jump.currentTime = 0;
                        audios.jump.play().catch(err => {});
                    }
                }
            }

            step() {
                const tmp = Math.floor(this.stepTimer / 280) % 4;
                switch (tmp) {
                    case 0: this.image = images.dino1; break;
                    case 1: this.image = images.dino2; break;
                    case 2: this.image = images.dino3; break;
                    case 3: this.image = images.dino6; break;
                }
                this.stepTimer += 20;
            }

            dieNormal() { this.image = images.dino4; this.isDead = true; }
            dieAsh() { this.image = images.dino5; this.isDead = true; }

            getFootBounds() { return {x: this.x+30, y: this.y+59, w:29, h:18}; }
            getHeadBounds() { return {x: this.x+66, y: this.y+25, w:32, h:22}; }
        }

        class Obstacle {
            constructor() {
                this.x = 800;
                this.y = 0;
                this.image = null;
                this.speed = 3;
                this.type = Math.floor(Math.random() * 4);
                this.isBoom = false;
                this.boomTimer = 0;
                this.scale = 1;

                switch (this.type) {
                    case 0:
                        this.image = images.cacti;
                        this.y = 300 - this.image.height - 8;
                        this.speed = 3;
                        break;
                    case 1:
                        this.image = images.stone;
                        this.y = 300 - this.image.height - 6;
                        this.speed = 3;
                        break;
                    case 2:
                        this.image = images.mechanicalCat;
                        this.y = 300 - this.image.height - 5;
                        this.speed = 5;
                        break;
                    case 3:
                        this.image = images.mechanicalMouse;
                        this.y = 300 - this.image.height;
                        this.speed = 4.5;
                        this.scale = 0.6;
                        break;
                }
            }

            move() { 
                if (!this.isBoom) {
                    this.x -= this.speed; 
                }
            }

            boom() {
                if (!this.isBoom) {
                    this.isBoom = true;
                    this.image = images.boom;
                    this.boomTimer = 0;
                }
            }

            isAshType() { 
                return this.type !== 0;
            }

            getBounds() {
                if (this.type === 0) return {x: this.x+7, y: this.y, w:15, h: this.image.height};
                if (this.type === 1) return {x: this.x+5, y: this.y+4, w:23, h: this.image.height-4};
                if (this.type === 2) return {x: this.x+5, y: this.y+2, w:49, h: this.image.height-2};
                if (this.type === 3) return {x: this.x+6*this.scale, y: this.y+3*this.scale, w:52*this.scale, h: this.image.height-3*this.scale};
                return {x: this.x, y: this.y, w: this.image.width, h: this.image.height};
            }

            isAlive() { 
                if (this.isBoom) {
                    this.boomTimer += 20;
                    return this.boomTimer < 500;
                }
                return this.x > -this.image.width; 
            }
        }

        // ===================== 3. 游戏主逻辑 =====================
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        let dino = new Dinosaur();
        let obstacles = [new Obstacle()];
        let addObstacleTimer = 0;
        let score = 0;
        let scoreTimer = 0;
        let finish = false;
        let gameOverLock = false;
        let bgX = 0;
        const BG_SPEED = 3;
        let lastObstacleTime = 0;
        let lastTime = 0;

        function checkCollision(rect1, rect2) {
            return rect1.x < rect2.x + rect2.w &&
                   rect1.x + rect1.w > rect2.x &&
                   rect1.y < rect2.y + rect2.h &&
                   rect1.y + rect1.h > rect2.y;
        }

        function gameLoop(loopTime) {
            lastTime = loopTime;

            if (finish && !gameOverLock) {
                gameOverLock = true;
                audios.bgm.pause();
                setTimeout(() => {
                    alert("游戏结束！得分：" + score);
                    dino = new Dinosaur();
                    obstacles = [new Obstacle()];
                    addObstacleTimer = 0;
                    score = 0;
                    scoreTimer = 0;
                    finish = false;
                    gameOverLock = false;
                    bgX = 0;
                    lastObstacleTime = 0;
                    audios.bgm.currentTime = 0;
                    if (audioInited) {
                        audios.bgm.play().catch(err => {});
                    }
                }, 500);
            }

            if (images.bg.complete && images.bg.naturalWidth > 0) {
                if (!dino.isDead) {
                    bgX -= BG_SPEED;
                    if (bgX <= -canvas.width) bgX = 0;
                }
                ctx.drawImage(images.bg, bgX, 0, canvas.width, canvas.height);
                ctx.drawImage(images.bg, bgX + canvas.width, 0, canvas.width, canvas.height);
            } else {
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
            }

            dino.move();
            ctx.drawImage(dino.image, dino.x, dino.y);

            addObstacleTimer += 20;
            const obsTime = addObstacleTimer;
            const normalGenerate = obsTime - lastObstacleTime >= 2000 && 
                                   Math.random() * 100 > 60 && 
                                   obstacles.length < 3;
            const forceGenerate = obsTime - lastObstacleTime >= 2200 && obstacles.length < 3;
            
            if (normalGenerate || forceGenerate) {
                obstacles.push(new Obstacle());
                lastObstacleTime = obsTime;
            }

            for (let i = 0; i < obstacles.length; i++) {
                let o = obstacles[i];
                if (o.isAlive()) {
                    o.move();
                    if (o.type === 3 && o.scale) {
                        ctx.save();
                        ctx.translate(o.x + o.image.width/2, o.y + o.image.height/2);
                        ctx.scale(o.scale, o.scale);
                        ctx.drawImage(o.image, -o.image.width/2, -o.image.height/2);
                        ctx.restore();
                    } else {
                        ctx.drawImage(o.image, o.x, o.y);
                    }
                    
                    if (!dino.isDead && !finish) {
                        let footBounds = dino.getFootBounds();
                        let headBounds = dino.getHeadBounds();
                        let obsBounds = o.getBounds();
                        if (checkCollision(footBounds, obsBounds) || checkCollision(headBounds, obsBounds)) {
                            finish = true;
                            if (audioInited) {
                                audios.hit.currentTime = 0;
                                audios.hit.play().catch(err => {});
                            }
                            if (o.isAshType()) {
                                o.boom();
                                dino.dieAsh();
                            } else {
                                dino.dieNormal();
                            }
                        }
                    }
                } else {
                    obstacles.splice(i, 1);
                    i--;
                }
            }

            if (!dino.isDead) {
                scoreTimer += 20;
                if (scoreTimer >= 500) {
                    score += 10;
                    scoreTimer = 0;
                }
            }
            ctx.fillStyle = '#000';
            ctx.font = 'bold 24px 黑体';
            ctx.fillText(String(score).padStart(6, '0'), 700, 30);

            requestAnimationFrame(gameLoop);
        }

        // ===================== 4. 事件监听 =====================
        function initAudio() {
            if (!audioInited) {
                audios.bgm.load();
                audios.hit.load();
                audios.jump.load();
                audioInited = true;
            }
            if (audioInited && !dino.isDead && !finish) {
                audios.bgm.play().catch(err => {});
            }
        }

        function jumpAction() {
            dino.jump();
            initAudio();
        }

        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space') {
                e.preventDefault();
                jumpAction();
            }
        });

        canvas.addEventListener('mousedown', (e) => {
            e.preventDefault();
            jumpAction();
        });

        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            jumpAction();
        }, { passive: false });

        // ===================== 5. 启动游戏 =====================
        let loadedCount = 0;
        const totalImages = Object.keys(images).length;
        for (let key in images) {
            images[key].onload = () => {
                loadedCount++;
                if (loadedCount === totalImages) {
                    requestAnimationFrame(gameLoop);
                }
            };
            images[key].onerror = (err) => {
                console.error("图片加载失败：", key, images[key].src);
                loadedCount++;
                if (loadedCount === totalImages) requestAnimationFrame(gameLoop);
            };
        }
    </script>
</body>
</html>
